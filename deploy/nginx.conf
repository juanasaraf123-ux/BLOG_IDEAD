# Nginx — Portal IDEAD (ejemplo). Ajustar dominio, rutas y versión de PHP-FPM.
# Un solo dominio: portal (estático) en /, panel en /admin, API Laravel en /api, /sanctum y /storage.
server {
    listen 80;
    server_name idead.example.edu.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name idead.example.edu.co;

    ssl_certificate     /etc/ssl/idead/fullchain.pem;
    ssl_certificate_key /etc/ssl/idead/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Frontend compilado (npm run build → frontend/dist)
    root /var/www/idead/frontend/dist;
    index index.html;

    client_max_body_size 25m;            # coherente con «Tamaño máximo de archivo» del panel
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /geo/    { expires 30d; try_files $uri =404; }

    # Panel privado (opcional: restringir por red institucional)
    location /admin {
        # allow 10.0.0.0/8; deny all;
        try_files $uri /admin/index.html;
    }

    # API Laravel
    location ~ ^/(api|sanctum|up)(/|$) {
        root /var/www/idead/backend/public;
        try_files $uri /index.php?$query_string;
    }
    location ^~ /storage/ {
        alias /var/www/idead/backend/storage/app/public/;   # SOLO imágenes públicas
        expires 30d;
        location ~ \.(php|phtml|phar|sh|js|html|svg)$ { deny all; }
    }
    location = /index.php {
        root /var/www/idead/backend/public;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Portal público (SPA)
    location / { try_files $uri /index.html; }

    location ~ /\.(?!well-known) { deny all; }
}
