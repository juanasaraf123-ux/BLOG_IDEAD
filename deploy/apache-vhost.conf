# Apache 2.4 — Portal IDEAD (ejemplo). Requiere mod_rewrite, mod_headers, mod_ssl, mod_proxy_fcgi y PHP-FPM 8.3+.
<VirtualHost *:443>
    ServerName idead.example.edu.co
    DocumentRoot /var/www/idead/frontend/dist

    SSLEngine on
    SSLCertificateFile    /etc/ssl/idead/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/idead/privkey.pem

    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    LimitRequestBody 26214400

    # API Laravel
    Alias /api     /var/www/idead/backend/public/index.php
    Alias /sanctum /var/www/idead/backend/public/index.php
    Alias /storage /var/www/idead/backend/storage/app/public
    <Directory /var/www/idead/backend/public>
        Require all granted
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>
    <Directory /var/www/idead/backend/storage/app/public>
        Require all granted
        php_admin_flag engine off
        <FilesMatch "\.(php|phtml|phar|html|js|svg)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/idead/frontend/dist>
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]
        RewriteRule ^admin(/.*)?$ /admin/index.html [L]
        RewriteRule ^ /index.html [L]
    </Directory>
</VirtualHost>
